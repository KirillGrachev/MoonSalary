settings:
  enabled: true # Full on/off switch of the plugin
  payout:
    mode: GLOBAL # GLOBAL - payday: everyone is paid at the same time, every interval
    # PERSONAL - personal timer: the countdown starts when the player joins
    interval: 3600 # Time between payouts (in seconds)
    pause_while_afk: true # PERSONAL mode: AFK time does not count towards the payout countdown -
      # the personal deadline is paused while the player is marked AFK and resumes on return.
      # false - the old behavior: the window is consumed on deadline and an AFK player gets blocked
    fallback_group: default # Group paid when the player has no group.<name> permission at all
    # (no permission plugin installed, fresh player, etc.). Empty string = no fallback
  execute_commands: true # Execute the commands of the salary group
  format_money: false # Format {money} through the economy plugin (Vault), otherwise - a plain number
  title:
    enabled: true # Show the title on payout
    fade_in: 20
    stay: 70
    fade_out: 20

  afk:
    enabled: true # AFK protection
    check_interval: 20 # How often the player position is checked (in seconds)
    threshold: 300 # How long the player has to stand still to become AFK (in seconds)
    ignore_rotation: true # Do not treat head rotation as movement
    # The check is silent by design: no messages, sounds or titles.
    # It only blocks the payout, so it never conflicts with other AFK plugins.

  permissions:
    enabled: true # Enable permission system (bypass.afk, admin.reload, admin.list, admin.info)
    prefix: "group." # Prefix of the group permission (LuckPerms: group.vip)
    bypass_afk: "moonsalary.bypass.afk"
    reload: "moonsalary.admin.reload"
    list: "moonsalary.admin.list"
    info: "moonsalary.admin.info" # View salary info of OTHER players (/salary info <player>)

  storage:
    # Where personal payout windows and the payout history live:
    # YAML - payouts.yml file in the plugin folder (default, zero setup)
    # SQLITE - SQLite database file in the plugin folder
    # MYSQL - tables in an external MySQL database
    # H2 - embedded database file in the plugin folder (MySQL syntax)
    type: YAML
    download_libraries: true # Download driver jars into the libs folder on first SQL use (place jars manually to skip)
    history_limit: 10 # Payout log entries kept per player (0 - no history at all)
    sql: # Used by MYSQL only (SQLITE/H2 ignore connection settings)
      host: "localhost"
      port: 3306
      database: "moonsalary"
      table: "moonsalary" # Tables <table>_players and <table>_history are created automatically
      user: "root"
      password: ""
      properties: # Extra JDBC URL parameters (MYSQL)
        useSSL: "false"
        autoReconnect: "true"

  sounds:
    salary:
      enabled: true
      sound: BLOCK_WOODEN_BUTTON_CLICK_ON
      volume: 0.6
      pitch: 1.0

# Salary groups live in groups.yml (content, not behavior).
messages: # Player-facing messages. Console (diagnostic) messages live in the code
  # (ConsoleMessage enum) on purpose: editing this file can never break server logs.
  # Placeholders: {money}, {player}, {group}, {interval}, {status}, {commands},
  # {next}, {last_payout}, {prefix}, {servertime_<pattern>}, %placeholder% (PlaceholderAPI).
  # HEX colors are supported: #42fffc text

  prefix: "&b&lM&9&lL &7» &f"

  on_salary:
    enabled: true # Group messages (see groups.<name>.messages in groups.yml)
    title: "&6Salary" # Placeholders work in title and subtitle
    subtitle: "&fYou received &e{money} ⛂"
    blocked_afk: '' # One line on a blocked payout; empty string = stay silent (example: "{prefix}&cYou are AFK - no salary this time")

  command:
    no_permission: "{prefix}&cYou don't have permission to do that."
    usage: "{prefix}&7Usage: &e/salary &7[info|reload|list] [online player]"
    unknown_player: "{prefix}&cPlayer &e{player} &cnot found."
    reload_success: "{prefix}&aConfiguration reloaded successfully!"

    give:
      usage: "{prefix}&7Usage: &e/salary give <player> <group>"
      success: "{prefix}&aPaid &e{money} ⛂ &a(group &e{group}&a) to &e{player}"
      failed: "{prefix}&cPayout failed for &e{player} &c(group &e{group}&c): cancelled by event or economy error"
      unknown_group: "{prefix}&cUnknown group: &e{group}"

    info:
      self:
        - ""
        - " &6╔ &fYour salary"
        - " &6╠ &fGroup: &e{group}"
        - " &6╠ &fAmount: &e{money} ⛂"
        - " &6╠ &fInterval: &e{interval} sec."
        - " &6╠ &fNext payout: &e{next}"
        - " &6╠ &fLast payout: &e{last_payout}"
        - " &6╠ &fStatus: {status}"
        - " &6╚ &fCommands: &e{commands}"
        - ""
      other:
        - ""
        - " &6╔ &fSalary of &e{player}"
        - " &6╠ &fGroup: &e{group}"
        - " &6╠ &fAmount: &e{money} ⛂"
        - " &6╠ &fNext payout: &e{next}"
        - " &6╠ &fLast payout: &e{last_payout}"
        - " &6╠ &fStatus: {status}"
        - " &6╚ &fCommands: &e{commands}"
        - ""

    list:
      header: "{prefix}&7Salary groups (&e{count}&7):"
      entry: " &e{group} &8— &f{money} ⛂ &8(priority: {priority})"
      empty: "{prefix}&cNo groups configured."

    status:
      online: "&aonline"
      afk: "&cAFK"
      no_group: "&cgroup not found"
      no_payout: "&8never" # {last_payout} value while the history is empty

settings:
  enabled: true # Full on/off switch of the plugin
  payout:
    mode: GLOBAL # GLOBAL - payday: everyone is paid at the same time, every interval
    # PERSONAL - personal timer: the countdown starts when the player joins
    interval: 3600 # Time between payouts (in seconds)
    fallback_group: default # Group paid when the player has no group.<name> permission at all
    # (no permission plugin installed, fresh player, etc.). Empty string = no fallback
  execute_commands: true # Execute the commands of the salary group
  format_money: false # Format {money} through the economy plugin (Vault), otherwise - a plain number
  title:
    enabled: true # Show the title on payout
    fade_in: 20
    stay: 70
    fade_out: 20

  afk:
    enabled: true # AFK protection
    check_interval: 20 # How often the player position is checked (in seconds)
    threshold: 300 # How long the player has to stand still to become AFK (in seconds)
    ignore_rotation: true # Do not treat head rotation as movement
    # The check is silent by design: no messages, sounds or titles.
    # It only blocks the payout, so it never conflicts with other AFK plugins.

  permissions:
    enabled: true # Enable permission system (bypass.afk, admin.reload, admin.list)
    prefix: "group." # Prefix of the group permission (LuckPerms: group.vip)
    bypass_afk: "moonsalary.bypass.afk"
    reload: "moonsalary.admin.reload"
    list: "moonsalary.admin.list"

  sounds:
    salary:
      enabled: true
      sound: BLOCK_WOODEN_BUTTON_CLICK_ON
      volume: 0.6
      pitch: 1.0

messages:
  console: # Plugin messages in the server console (placeholders in {}, {prefix} supported, colors are stripped)
    enabled: true # Turn off to silence the plugin completely
    startup: "{prefix}MoonSalary is up and running! Groups: {groups}"
    shutdown: "{prefix}MoonSalary stopped!"
    disabled_by_config: "{prefix}The plugin is disabled in config.yml (settings.enabled: false) - no payouts will be made."
    economy_hooked: "{prefix}Economy hooked: {provider}"
    economy_waiting: "{prefix}Economy not found - retrying after the server startup completes."
    economy_late: "{prefix}Economy found - MoonSalary is fully enabled."
    economy_missing: "{prefix}MoonSalary could not enable: Vault and an economy plugin (EssentialsX, CMI, etc.) are required. Install the dependencies and restart the server."
    startup_failed: "{prefix}MoonSalary could not start: {reason} Payouts and AFK checks are disabled."
    vault_paused: "{prefix}Vault was disabled - salary payouts are paused."
    vault_resumed: "{prefix}Vault is back - salary payouts are resumed."
    reloaded: "{prefix}Configuration reloaded. Groups: {groups}"
    invalid_value: "{prefix}Invalid value for '{path}': {value}. Using: {defaultValue}."
    group_no_salary: "{prefix}Group '{group}' has no 'salary' field - skipped."
    groups_section_missing: "{prefix}Section 'groups' not found - no salaries will be paid."
    groups_empty: "{prefix}No salary groups found."
    fallback_group_missing: "{prefix}Fallback group '{group}' not found in groups - fallback is disabled."
    unknown_sound: "{prefix}Unknown sound at '{path}'."
    command_missing: "{prefix}Command '{command}' not found in plugin.yml."
    command_unregister_failed: "{prefix}Failed to unregister command '{command}': {reason}"
    placeholders_no_api: "{prefix}Messages contain %...% placeholders but PlaceholderAPI is not installed - they will not be processed."
    deposit_failed: "{prefix}Failed to deposit {money} to {player}: {reason}"
    deposit_exception: "{prefix}Economy error while paying {player}: {reason}"

  prefix: "&b&lM&9&lL &7» &f"

  on_salary:
    enabled: true # Group messages (see groups.<name>.messages)
    title: "&6Salary"
    subtitle: "&fYou received &e{money} ⛂"
    blocked_afk: '' # One line on a blocked payout; empty string = stay silent (example: "{prefix}&cYou are AFK - no salary this time")

  command:
    no_permission: "{prefix}&cYou don't have permission to do that."
    usage: "{prefix}&7Usage: &e/salary &7[info|reload|list] [player]"
    unknown_player: "{prefix}&cPlayer &e{player} &cnot found."
    reload_success: "{prefix}&aConfiguration reloaded successfully!"
    startup_failed: "{prefix}&cThe plugin could not start due to an internal error - check the console."

    info:
      self:
        - ""
        - " &6╔ &fYour salary"
        - " &6╠ &fGroup: &e{group}"
        - " &6╠ &fAmount: &e{money} ⛂"
        - " &6╠ &fInterval: &e{interval} sec."
        - " &6╠ &fNext payout: &e{next}"
        - " &6╠ &fStatus: {status}"
        - " &6╚ &fCommands: &e{commands}"
        - ""
      other:
        - ""
        - " &6╔ &fSalary of &e{player}"
        - " &6╠ &fGroup: &e{group}"
        - " &6╠ &fAmount: &e{money} ⛂"
        - " &6╠ &fNext payout: &e{next}"
        - " &6╠ &fStatus: {status}"
        - " &6╚ &fCommands: &e{commands}"
        - ""

    list:
      header: "{prefix}&7Salary groups (&e{count}&7):"
      entry: " &6▪ &e{group} &7- &f{money} ⛂ &8(priority: {priority})"
      empty: "{prefix}&cNo groups configured."

    status:
      online: "&aonline"
      afk: "&cAFK"
      offline: "&8offline"
      no_group: "&cgroup not found"

# Placeholders: {money}, {player}, {group}, {interval}, {status}, {commands}, {next}, {prefix}
# {prefix} is inserted only where the template asks for it - no automatic prefixing
# {next} - countdown to the next payout (personal timer or the nearest payday)
# HEX colors are supported: #42fffc text
groups: # Group name = permission (prefix + name), for example: group.vip

  default: # Base group - salary for everyone, including players without any group permission
    salary: 100
    priority: 0
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  vip: # Example of a donation group
    salary: 250
    priority: 1
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  premium:
    salary: 400
    priority: 2
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  legend:
    salary: 600
    priority: 3
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  media: # Group with an extra command on payout
    salary: 500
    priority: 4
    commands: # Console commands, placeholders: {player}, {money}, {group}
      - 'give {player} diamond 5'
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  helper: # Staff group
    salary: 700
    priority: 5
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  moderator: # Several commands at once
    salary: 800
    priority: 6
    commands:
      - 'give {player} golden_apple 3'
      - 'minecraft:xp add {player} 100 points'
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

  admin: # The highest priority - wins if the player has several groups
    salary: 1000
    priority: 7
    commands:
      - 'give {player} netherite_ingot 1'
    messages:
      - ''
      - '&f&6╔ &fThe salary hour has come!'
      - '&f&6╚ &fYou received &e{money} ⛂'
      - ''
      - '  &e⌛ %servertime_HH:mm% %servertime_dd/MM/yy%'
      - ''

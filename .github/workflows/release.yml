name: Release

# Пуш тега - не пуш ветки: отдельный workflow с собственным триггером,
# чтобы релизы действительно случались.
on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # publish в полёте не отменяется

jobs:
  release:
    name: GitHub release on tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify = compile (+ ErrorProne) + tests + jacoco report + coverage gate + spotless
      - name: Build and test
        run: mvn -B -ntp verify

      # Контрольная сумма рядом с jar: пользователь может проверить,
      # что скачал именно собранный релизом файл
      - name: Checksum
        run: |
          cd target
          sha256sum MoonSalary-*.jar > MoonSalary.jar.sha256
          cat MoonSalary.jar.sha256

      - name: Publish release with jar
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/MoonSalary-*.jar
            target/MoonSalary.jar.sha256
          generate_release_notes: true

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, coverage and jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify = compile (+ ErrorProne) + tests + jacoco report + coverage gate + spotless
      - name: Build, test and check coverage
        run: mvn -B -ntp verify

      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv', encoding='utf-8')))
          missed = sum(int(r['LINE_MISSED']) for r in rows)
          covered = sum(int(r['LINE_COVERED']) for r in rows)
          total = missed + covered
          print(f"Line coverage: {covered}/{total} = {covered / total:.1%}")
          print("Largest classes:")
          for r in sorted(rows, key=lambda r: int(r['LINE_COVERED']) + int(r['LINE_MISSED']), reverse=True)[:10]:
              c, m = int(r['LINE_COVERED']), int(r['LINE_MISSED'])
              print(f"  {r['PACKAGE']}.{r['CLASS']}: {c}/{c + m} = {c / (c + m):.0%}")
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MoonSalary-jar
          path: target/MoonSalary-*.jar
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  compat-compile:
    name: Compile against newer spigot-api (1.21.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Машина проверяет совместимость с новыми API, а не вера в авось
      - name: Compile against spigot 1.21.4
        run: mvn -B -ntp clean package -Dmaven.test.skip=true -Perrorprone-off -Dspigot.version=1.21.4-R0.1-SNAPSHOT

  smoke:
    name: Smoke on real Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Нижняя и верхняя граница заявленной поддержки: api-version 1.20 + Java 17
        # проверяются живым запуском, а не только компиляцией
        paper: [ '1.20.6', '1.21.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build jar
        run: mvn -B -ntp clean package -DskipTests -Perrorprone-off

      # Путь к jar решается glob-ом: bump версии в pom не ломает workflow
      - name: Resolve jar path
        id: jar
        run: echo "path=$(ls target/MoonSalary-*.jar | head -1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (no Vault: graceful disable, no stacktraces)
        run: bash ci/smoke-test.sh "${{ matrix.paper }}" "${{ steps.jar.outputs.path }}"
